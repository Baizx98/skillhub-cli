name: CI

'on':
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            out=skillhub
            if [[ "$os" == windows ]]; then out=skillhub.exe; fi
            GOOS="$os" GOARCH="$arch" go build -ldflags "-X main.version=${GITHUB_REF_NAME}" -o "build/$out" ./cmd/skillhub
            if [[ "$os" == windows ]]; then
              (cd build && zip -q "../dist/skillhub_${GITHUB_REF_NAME}_${os}_${arch}.zip" "$out")
            else
              tar -C build -czf "dist/skillhub_${GITHUB_REF_NAME}_${os}_${arch}.tar.gz" "$out"
            fi
          done
          (cd dist && sha256sum *.zip *.tar.gz > SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
